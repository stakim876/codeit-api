# ~/instagram-api/lab/compose.yaml
# 실습용 bookstore DB. 인스타그램 DB와 포트가 겹치지 않게 5433으로 연다.
services:
  db:
    image: postgres:18
    container_name: bookstore-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookstore
    volumes:
      - bookstore-data:/var/lib/postgresql

volumes:
  bookstore-data:
